# Manual deploy only. PR / main quality gates live in ci.yml (no build/deploy there).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RUNNER: &runner ubuntu-24.04

jobs:
  test:
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e:
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  lint:
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  lint-fsd:
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint:fsd

  build:
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          BASE_PATH: /frost-cv
      # SPA shell is _shell.html; Pages needs index.html + 404.html for deep links.
      - run: |
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: [test, e2e, lint, lint-fsd, build]
    runs-on: *runner
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
