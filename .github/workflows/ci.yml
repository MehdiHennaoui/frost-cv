name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER: &runner ubuntu-24.04

jobs:
  quality:
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm lint:fsd
