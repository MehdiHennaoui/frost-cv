pre-commit:
  parallel: false
  commands:
    refuse-ticket-on-main:
      run: bash scripts/refuse-ticket-commit-on-main.sh
    refuse-scratch-wizard:
      run: bash scripts/refuse-scratch-wizard-commit.sh
    biome:
      glob: "*.{js,jsx,ts,tsx,json}"
      run: pnpm exec biome check --write --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    lint-fsd:
      run: pnpm lint:fsd
